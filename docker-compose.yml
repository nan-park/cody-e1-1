# docker run 명령을 파일로 옮긴 것.
#   docker compose up -d   실행
#   docker compose ps      상태
#   docker compose logs    로그
#   docker compose down    종료 및 정리
#
# 서비스 2개(web + cache)를 함께 띄우고, 컨테이너 간 통신을 확인한다.

services:
  # ── 웹 서버 : 5단계에서 만든 Dockerfile 을 그대로 사용 ──────────────
  web:
    build: .                      # docker build -t ... .  에 해당
    image: cody-web:1.0           # 빌드 결과에 붙일 이름:태그
    container_name: cody-web
    ports:
      - "8090:8080"               # docker run -p 8090:8080  에 해당
    environment:                  # docker run -e ...  에 해당
      APP_ENV: compose
      NGINX_PORT: 8080
    volumes:
      # 개발용 바인드 마운트: 호스트 파일 수정이 즉시 반영된다 (읽기 전용)
      - ./app/site:/usr/share/nginx/html:ro
    depends_on:
      - cache                     # cache 를 먼저 시작한다
    restart: unless-stopped

  # ── 보조 서비스 : 캐시 서버(Redis) ────────────────────────────────
  cache:
    image: redis:7-alpine
    container_name: cody-cache
    command: ["redis-server", "--save", "60", "1"]   # 60초마다 스냅샷 저장
    volumes:
      - cache-data:/data          # 이름 있는 볼륨 → 컨테이너를 지워도 데이터 유지
    restart: unless-stopped
    # 포트를 호스트에 열지 않는다.
    # 같은 Compose 네트워크 안의 web 에서는 "cache:6379" 로 접근 가능하다.

# 이름 있는 볼륨 선언 (docker volume create 에 해당)
volumes:
  cache-data:
